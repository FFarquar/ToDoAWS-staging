<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <title>Todo Lists - Login</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <script src="./config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 24px; }
    .card { background: #fff; padding: 36px 32px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
    h2 { margin: 0 0 6px; color: #1e3a5f; text-align: center; font-size: 22px; }
    .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #2563eb; }
    button { width: 100%; padding: 11px; background: #2563eb; border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.loading::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    .error { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
    .env-badge { text-align: center; margin-bottom: 16px; }
    .env-badge span { background: #6b7280; color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Todo Lists</h2>
  <p class="subtitle">Sign in to your account</p>
  <div class="env-badge"><span id="envBadge" style="display:none;"></span></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required placeholder="Enter username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="Enter password" />
    </div>
    <button type="submit" id="loginBtn">Sign In</button>
  </form>

  <div id="errorMsg" class="error"></div>
</div>

<script>
  (function () {
    const env = window.APP_CONFIG?.ENVIRONMENT;
    if (!env || env === 'PRODUCTION') return;
    const badge = document.getElementById('envBadge');
    badge.textContent = env;
    badge.style.display = 'inline';
    const colours = { STAGING: '#f59e0b', LOCAL: '#6b7280' };
    badge.parentElement.querySelector('span').style.background = colours[env] || '#6b7280';
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');

    errorDiv.style.display = 'none';
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      if (window.APP_CONFIG?.USE_MOCK) {
        const res = await fetch('./mockdata/mock-users.json');
        const users = await res.json();
        const user = users.find(u => u.loginID === username && u.active);
        if (!user) throw new Error('Invalid username or password');
        localStorage.setItem('authToken', 'mock-token-local');
        localStorage.setItem('token', 'mock-token-local');
        localStorage.setItem('userRole', user.role);
        localStorage.setItem('userLoginID', user.loginID);
        window.location.href = 'todo.html';
        return;
      }

      const res = await fetch(`${window.APP_CONFIG.API_BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginID: username, password }),
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (!res.ok) throw new Error(data.message || 'Invalid username or password');

      localStorage.setItem('authToken', data.accessToken || data.token);
      localStorage.setItem('token', data.accessToken || data.token);
      localStorage.setItem('userRole', data.role || 'USER');
      localStorage.setItem('userLoginID', username);
      window.location.href = 'todo.html';

    } catch (err) {
      errorDiv.textContent = err.message === 'Failed to fetch'
        ? 'Unable to connect. Check your network connection.'
        : err.message;
      errorDiv.style.display = 'block';
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
